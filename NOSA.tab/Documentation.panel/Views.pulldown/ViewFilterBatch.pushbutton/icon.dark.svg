  <rect x="22" y="22" width="8" height="6" rx="1" fill="none" stroke="#DCDCDC" stroke-width="1.2"/>
  <!-- Check marks on views -->
  <polyline points="24,17 25.5,18.5 28,16" fill="none" stroke="#DCDCDC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="24,25 25.5,26.5 28,24" fill="none" stroke="#DCDCDC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
