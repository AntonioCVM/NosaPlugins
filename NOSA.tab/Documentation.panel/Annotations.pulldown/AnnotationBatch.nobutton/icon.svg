<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Plan view grid lines -->
  <rect x="3" y="3" width="26" height="26" rx="2" fill="none" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Column squares -->
  <rect x="5" y="5"  width="5" height="5" fill="#DDDDDD" stroke="#555555" stroke-width="1"/>
  <rect x="22" y="5"  width="5" height="5" fill="#DDDDDD" stroke="#555555" stroke-width="1"/>
  <rect x="5" y="22" width="5" height="5" fill="#DDDDDD" stroke="#555555" stroke-width="1"/>
  <rect x="22" y="22" width="5" height="5" fill="#DDDDDD" stroke="#555555" stroke-width="1"/>
  <!-- Tag leader lines (orange) -->
  <line x1="10" y1="7" x2="16" y2="12" stroke="#FF5F00" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="16" y="10" width="8" height="5" rx="1" fill="#FF5F00"/>
  <text x="20" y="14.5" font-family="Century Gothic,sans-serif" font-size="4" font-weight="bold"
        fill="white" text-anchor="middle">C1</text>
</svg>
