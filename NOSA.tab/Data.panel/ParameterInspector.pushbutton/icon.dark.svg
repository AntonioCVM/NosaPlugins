<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Parameter table -->
  <rect x="2" y="2" width="20" height="22" rx="1.5" fill="none" stroke="#DCDCDC" stroke-width="1.5"/>
  <!-- Column divider -->
  <line x1="13" y1="2" x2="13" y2="24" stroke="#555555" stroke-width="1"/>
  <!-- Row dividers -->
  <line x1="2" y1="8"  x2="22" y2="8"  stroke="#555555" stroke-width="1"/>
  <line x1="2" y1="13" x2="22" y2="13" stroke="#555555" stroke-width="1"/>
  <line x1="2" y1="18" x2="22" y2="18" stroke="#555555" stroke-width="1"/>
  <!-- Header row (orange) -->
  <line x1="4"  y1="5" x2="11" y2="5" stroke="#FF5F00" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="15" y1="5" x2="20" y2="5" stroke="#FF5F00" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Data rows -->
  <line x1="4"  y1="10.5" x2="10" y2="10.5" stroke="#888888" stroke-width="1"/>
  <line x1="15" y1="10.5" x2="20" y2="10.5" stroke="#888888" stroke-width="1"/>
  <line x1="4"  y1="15.5" x2="11" y2="15.5" stroke="#888888" stroke-width="1"/>
  <line x1="15" y1="15.5" x2="19" y2="15.5" stroke="#888888" stroke-width="1"/>
  <line x1="4"  y1="20.5" x2="9"  y2="20.5" stroke="#888888" stroke-width="1"/>
  <line x1="15" y1="20.5" x2="20" y2="20.5" stroke="#888888" stroke-width="1"/>
  <!-- Magnifying glass -->
  <circle cx="23" cy="25" r="5.5" fill="none" stroke="#FF5F00" stroke-width="2"/>
  <line x1="27" y1="29" x2="30" y2="31" stroke="#FF5F00" stroke-width="2.2" stroke-linecap="round"/>
</svg>
