<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Family root node -->
  <rect x="11" y="2" width="10" height="6" rx="1.2" fill="none" stroke="#333333" stroke-width="1.4"/>
  <!-- Trunk line -->
  <line x1="16" y1="8" x2="16" y2="12" stroke="#333333" stroke-width="1.2"/>
  <!-- Branch line -->
  <line x1="7" y1="12" x2="25" y2="12" stroke="#333333" stroke-width="1.2"/>
  <!-- Left branch down -->
  <line x1="7" y1="12" x2="7" y2="16" stroke="#333333" stroke-width="1.2"/>
  <!-- Right branch down -->
  <line x1="25" y1="12" x2="25" y2="16" stroke="#333333" stroke-width="1.2"/>
  <!-- Left child node (orange) -->
  <rect x="2" y="16" width="10" height="6" rx="1.2" fill="#FF5F00"/>
  <!-- Right child node (orange) -->
  <rect x="20" y="16" width="10" height="6" rx="1.2" fill="#FF5F00"/>
  <!-- Magnifying glass overlay -->
  <circle cx="13" cy="27" r="4" fill="none" stroke="#333333" stroke-width="1.8"/>
  <line x1="16" y1="30" x2="19" y2="31" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
</svg>
