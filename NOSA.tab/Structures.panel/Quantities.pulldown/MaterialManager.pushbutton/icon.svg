<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Top layer (orange — active/selected material) -->
  <rect x="3" y="4" width="26" height="5" rx="1.2" fill="#FF5F00"/>
  <!-- Second layer -->
  <rect x="3" y="11" width="26" height="5" rx="1.2" fill="none" stroke="#333333" stroke-width="1.3"/>
  <!-- Diagonal hatch pattern in second layer -->
  <line x1="3"  y1="13" x2="6"  y2="11" stroke="#AAAAAA" stroke-width="0.9"/>
  <line x1="7"  y1="16" x2="12" y2="11" stroke="#AAAAAA" stroke-width="0.9"/>
  <line x1="13" y1="16" x2="18" y2="11" stroke="#AAAAAA" stroke-width="0.9"/>
  <line x1="19" y1="16" x2="24" y2="11" stroke="#AAAAAA" stroke-width="0.9"/>
  <line x1="25" y1="16" x2="29" y2="12" stroke="#AAAAAA" stroke-width="0.9"/>
  <!-- Third layer -->
  <rect x="3" y="18" width="26" height="5" rx="1.2" fill="none" stroke="#333333" stroke-width="1.3"/>
  <!-- Fourth layer (thin, lighter) -->
  <rect x="3" y="25" width="26" height="3" rx="1" fill="#DDDDDD" stroke="#BBBBBB" stroke-width="0.8"/>
</svg>
